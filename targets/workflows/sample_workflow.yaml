name: "Generic User Lifecycle & BOLA Verification Flow"
description: "Demonstrates sequential variable extraction, dependent resource lookup, and cross-user authorization assertion"
base_url: "http://127.0.0.1:8000"
initial_context:
  target_user: "primary_user"
steps:
  - name: "Health Check"
    endpoint: "/api/v1/users"
    method: "GET"
    expected_status: [200]
    extract:
      server_header: "headers.server"

  - name: "Lookup User Profile"
    endpoint: "/api/v1/users/{{target_user}}"
    method: "GET"
    expected_status: [200]
    extract:
      user_email: "email"
      extracted_username: "username"

  - name: "Cross-User Access Verification (Secondary User)"
    endpoint: "/api/v1/users/{{extracted_username}}"
    method: "GET"
    auth_user: "user2"
    # When assert_denied is true, any 2xx response confirms an API1:2023 BOLA vulnerability.
    assert_denied: true
