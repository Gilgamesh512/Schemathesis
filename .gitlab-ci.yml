stages:
  - test
  - security-scan
  - quality-gate

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

before_script:
  - python3 -m venv .venv
  - source .venv/bin/activate
  - pip install -r requirements-dev.txt

unit-tests:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pytest

api-security-scan:
  stage: security-scan
  image: python:3.12-slim
  variables:
    TARGET_URL: "https://petstore.swagger.io/v2"
    TARGET_SCHEMA: "https://petstore.swagger.io/v2/swagger.json"
  script:
    - python run_all.py scan --url "$TARGET_URL" --schema "$TARGET_SCHEMA" --verify-concurrency
  artifacts:
    when: always
    paths:
      - results/
    reports:
      sast: results/vulnerabilities.sarif

enforce-security-gate:
  stage: quality-gate
  image: python:3.12-slim
  dependencies:
    - api-security-scan
  script:
    - python run_all.py gate --max-critical 0 --max-high 2
