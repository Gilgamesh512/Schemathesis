name: API Security Fuzzing & Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 1' # Weekly security regression test on Mondays at 2AM UTC

jobs:
  api-security-audit:
    name: API Fuzzing & OWASP Top 10 Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit & Policy Verification Tests
        run: |
          python -m pytest

      - name: Execute Security Fuzzing Scan
        env:
          TARGET_URL: ${{ secrets.API_TARGET_URL || 'https://petstore.swagger.io/v2' }}
          TARGET_SCHEMA: ${{ secrets.API_SCHEMA_URL || 'https://petstore.swagger.io/v2/swagger.json' }}
          AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN || '' }}
        run: |
          python run_all.py scan \
            --url "$TARGET_URL" \
            --schema "$TARGET_SCHEMA" \
            --verify-tokens \
            --verify-concurrency

      - name: Evaluate DevSecOps Security Quality Gate
        env:
          CUSTOM_TARGET: ${{ secrets.API_TARGET_URL }}
        run: |
          echo "============================================================"
          echo "🛡️  DEVSECOPS SECURITY QUALITY GATE VERIFICATION"
          echo "============================================================"
          if [ -n "$CUSTOM_TARGET" ]; then
            echo "[i] Mode: Enterprise Custom Target ($CUSTOM_TARGET)"
            echo "[i] Enforcing strict zero-tolerance gate policy..."
            python run_all.py gate --max-critical 0 --max-high 2
          else
            echo "[i] Mode: Framework Smoke Test (Public Demo: Petstore)"
            echo "[i] Phase 1: Verifying Quality Gate Enforcer detects and blocks exploits..."
            set +e
            python run_all.py gate --max-critical 0 --max-high 2 > gate_enforce.log 2>&1
            GATE_STATUS=$?
            set -e
            cat gate_enforce.log
            if [ $GATE_STATUS -ne 0 ]; then
              echo "✅ Gate Enforcer Verified: Confirmed exploits were correctly detected and blocked!"
            fi
            echo "[i] Phase 2: Passing framework smoke test validation..."
            python run_all.py gate --max-critical 0 --max-high 2 --allow-confirmed
          fi

      - name: Upload OASIS SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true # Private repositories require GitHub Advanced Security (GHAS) for Code Scanning; reports are archived in the next step
        with:
          sarif_file: results/vulnerabilities.sarif
          category: schemathesis-api-security

      - name: Archive Security Reports & Dashboards
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-security-reports
          path: |
            results/latest_report.html
            results/vulnerabilities.csv
            results/vulnerabilities.sarif
