openapi: "3.0.3"
info:
  title: "DummyJSON E-Commerce & Auth Real-World API"
  version: "1.0.0"
  description: "Real-world mock API with authentication, carts, orders, and products"
servers:
  - url: "https://dummyjson.com"
paths:
  /auth/login:
    post:
      summary: "User Authentication"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                username:
                  type: "string"
                password:
                  type: "string"
                expiresInMins:
                  type: "integer"
              required: ["username", "password"]
      responses:
        "200":
          description: "Login successful with token"

  /products:
    get:
      summary: "Get all products"
      parameters:
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
        - name: "skip"
          in: "query"
          schema:
            type: "integer"
      responses:
        "200":
          description: "List of products"
    post:
      summary: "Add new product"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                title:
                  type: "string"
                price:
                  type: "number"
              required: ["title"]
      responses:
        "201":
          description: "Product created"

  /products/{id}:
    get:
      summary: "Get single product"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "Product details"

  /carts/add:
    post:
      summary: "Add products to cart (E-Commerce state change)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                userId:
                  type: "integer"
                products:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      id:
                        type: "integer"
                      quantity:
                        type: "integer"
              required: ["userId", "products"]
      responses:
        "200":
          description: "Cart updated"

  /users:
    get:
      summary: "Get all users"
      parameters:
        - name: "X-Requested-With"
          in: "header"
          schema:
            type: "string"
      responses:
        "200":
          description: "List of users"

  /users/{id}:
    get:
      summary: "Get user by ID"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "User details"
