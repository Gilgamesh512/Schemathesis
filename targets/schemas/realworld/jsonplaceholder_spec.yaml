openapi: "3.0.3"
info:
  title: "JSONPlaceholder Real-World REST API"
  version: "1.0.0"
  description: "Public real-world prototyping and testing API with full CRUD resources"
servers:
  - url: "https://jsonplaceholder.typicode.com"
paths:
  /posts:
    get:
      summary: "List all posts"
      parameters:
        - name: "userId"
          in: "query"
          required: false
          schema:
            type: "integer"
      responses:
        "200":
          description: "List of posts"
    post:
      summary: "Create a new post"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                title:
                  type: "string"
                body:
                  type: "string"
                userId:
                  type: "integer"
              required: ["title", "body", "userId"]
      responses:
        "201":
          description: "Post created"

  /posts/{id}:
    get:
      summary: "Get post by ID"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "Post details"
    put:
      summary: "Update post by ID"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                title:
                  type: "string"
                body:
                  type: "string"
                userId:
                  type: "integer"
      responses:
        "200":
          description: "Post updated"
    delete:
      summary: "Delete post by ID"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "Post deleted"

  /users:
    get:
      summary: "List users"
      responses:
        "200":
          description: "List of users"

  /users/{id}:
    get:
      summary: "Get user by ID"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "User details"

  /comments:
    get:
      summary: "List comments"
      parameters:
        - name: "postId"
          in: "query"
          required: false
          schema:
            type: "integer"
      responses:
        "200":
          description: "List of comments"
